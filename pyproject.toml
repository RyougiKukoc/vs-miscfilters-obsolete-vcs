[build-system]
requires = ["hatchling>=1.30", "packaging>=24.0", "meson>=0.49", "ninja"]
build-backend = "hatchling.build"

[project]
name = "vapoursynth-misc"
version = "1.0"
description = "Miscellaneous VapourSynth filters: SCDetect, AverageFrames, and Hysteresis"
readme = "README.md"
license = { file = "LICENSE" }
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "MiscFilters contributors" }]
dependencies = ["VapourSynth>=77"]

[project.urls]
"Source Code" = "https://github.com/RyougiKukoc/vs-miscfilters-obsolete-vcs"
"Releases" = "https://github.com/RyougiKukoc/vs-miscfilters-obsolete-vcs/releases"

[tool.hatch.build.targets.sdist]
include = [
  "LICENSE",
  "README.md",
  "docs",
  "hatch_build.py",
  "meson.build",
  "msvc_project",
  "pyproject.toml",
  "src",
  "tools",
]

[tool.hatch.build.targets.wheel]
include = ["vapoursynth/plugins"]
artifacts = [
  "vapoursynth/plugins/**/*.dll",
  "vapoursynth/plugins/**/*.so",
  "vapoursynth/plugins/**/*.dylib",
  "vapoursynth/plugins/**/manifest.vs",
  "vapoursynth/plugins/**/LICENSE",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
